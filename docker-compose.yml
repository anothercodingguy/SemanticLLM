version: '3.8'

services:
  semantic-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CACHE_SIMILARITY_THRESHOLD=0.82
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
    depends_on:
      - qdrant
      - redis
    networks:
      - semantic-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - semantic-net

  redis:
    image: redis:7-alpine
    container_name: semantic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - semantic-net

volumes:
  qdrant_data:
  redis_data:

networks:
  semantic-net:
    driver: bridge
